[package]
name = "hz-iamf"
description = "IAMF (Immersive Audio Model and Formats) writing for harlettizer"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

# Dependency-free apart from the shared bit writer, like every codec crate
# here: see hz-mlp's manifest for why.
[dependencies]
hz-core.workspace = true

[build-dependencies]
pkg-config = { version = "0.3", optional = true }

[features]
# Opus substreams, through the system's libopus — found by pkg-config, linked
# dynamically. Off by default: everything else here is pure Rust and builds
# without a C library anywhere. See src/opus.rs for why it is not a port.
opus = ["dep:pkg-config"]

[dev-dependencies]
# An independent FLAC decoder, for the round trips in the tests and nothing
# else. Nothing shipped links it.
symphonia-core = { version = "0.5", default-features = false }
symphonia-bundle-flac = "0.5"
