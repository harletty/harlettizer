[package]
name = "hz-io"
description = "Master file set, container and ADM I/O for harlettizer"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
hz-core.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
quick-xml.workspace = true

# Whether two paths are one file, hard links included: the volume and file
# index on Windows, which the standard library does not offer there. Unix
# compares device and inode through the standard library, without opening.
[target.'cfg(not(unix))'.dependencies]
same-file.workspace = true
