[package]
name = "xtask"
description = "Development harness for harlettizer: survey runs and reports"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
hz-ac3.workspace = true
hz-analysis.workspace = true
hz-cluster.workspace = true
hz-core.workspace = true
hz-dca.workspace = true
hz-io.workspace = true
hz-matroska.workspace = true
hz-joc.workspace = true
hz-meta.workspace = true
hz-programme.workspace = true
hz-mlp = { workspace = true, features = ["parallel"] }
hz-render.workspace = true
# An independent reader for the object metadata payload, used as an oracle and
# nothing else — see docs/objects.md for why the installed decoder is not
# enough on its own.
#
# Off by default because compiling it needs **13.4 GiB**, measured; a hosted
# runner for a private repository has 7 GB, and one crate wanting twice the
# machine is not something a job's parallelism can be tuned around. Turn it on
# where there is room: `cargo xtask --features oracle`.
truehd = { version = "0.7.1", optional = true }
# An independent E-AC-3 decoder — syncframes, their Evolution frames, the
# object metadata and joint object coding payloads, and the objects those
# reconstruct — used as an oracle for the lossy track and nothing else. Off by
# default like the one above, so the harness builds without it:
# `cargo run -p xtask --features eac3-oracle -- eac3 …`.
eac3 = { git = "https://github.com/harletty/harletty-bridge", tag = "v0.9.0", optional = true }
# An independent DTS decoder: core, extension substream, lossless extension and
# the DTS:X extension — used as an oracle for the DTS track and nothing else.
# Off by default, so the harness builds without it:
# `cargo run -p xtask --features dca-oracle -- dts …`.
dca = { git = "https://github.com/harletty/harletty-bridge", tag = "v0.9.0", optional = true }
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
clap.workspace = true

[features]
# An independent reader for the object metadata payload. See above for the cost.
oracle = ["dep:truehd"]
# An independent E-AC-3 decoder. See above.
eac3-oracle = ["dep:eac3"]
# An independent DTS decoder. See above.
dca-oracle = ["dep:dca"]
